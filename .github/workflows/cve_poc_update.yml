name: Update README with CVE PoCs

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

jobs:
  update-cve-poc:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Search, review and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/update_cve_poc.py

      - name: Commit and push changes
        run: |
          if [ ! -f .commit_titles.txt ]; then
            echo "No new PoCs to commit."
            exit 0
          fi
          git config --global user.name "${{ github.repository_owner }}"
          git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add README.md
          git commit -F .commit_titles.txt
          git pull --rebase --quiet
          git push --quiet
          rm -f .commit_titles.txt
